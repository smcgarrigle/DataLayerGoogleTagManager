name: wpgtm

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # 3306 is already in use on this host, so expose on 3307.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8888}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # Surfaced to PHP so the mu-plugin can read them without a DB write.
      GTM_CONTAINER_ID: ${GTM_CONTAINER_ID:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      GTM_ENV_AUTH: ${GTM_ENV_AUTH:-}
      GTM_ENV_PREVIEW: ${GTM_ENV_PREVIEW:-}
      WORDPRESS_CONFIG_EXTRA: |
        /* Pin both URLs to the mapped port or WP will redirect-loop to :80. */
        define( 'WP_HOME',    'http://localhost:${WP_PORT:-8888}' );
        define( 'WP_SITEURL', 'http://localhost:${WP_PORT:-8888}' );
        define( 'WP_DEBUG_LOG',     true );
        define( 'WP_DEBUG_DISPLAY', false );   // never echo notices into <head>
        define( 'SCRIPT_DEBUG',     true );    // unminified core JS
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'AUTOSAVE_INTERVAL', 300 );
        define( 'WP_POST_REVISIONS', 3 );
        define( 'GTM_LAB_CONTAINER_ID',   getenv('GTM_CONTAINER_ID')   ?: '' );
        define( 'GTM_LAB_GA4_ID',         getenv('GA4_MEASUREMENT_ID') ?: '' );
        define( 'GTM_LAB_ENV_AUTH',       getenv('GTM_ENV_AUTH')       ?: '' );
        define( 'GTM_LAB_ENV_PREVIEW',    getenv('GTM_ENV_PREVIEW')    ?: '' );
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

  # One-shot helper: `docker compose run --rm wpcli wp <command>`
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts:ro
    entrypoint: ["wp", "--path=/var/www/html"]
    command: ["--info"]
    profiles: ["tools"]

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
